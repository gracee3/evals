# Paired overnight comparison using the merged qwen38-lab v1 profiles.
# Counts are total per benchmark, shared by both models through seed-42 IDs.
version: 1
models: [int4-v1, int8-v2]
runtime_profiles:
  int4-v1: int4-v1-16k-fp8-tp1
  int8-v2: int8-v2-16k-bf16-tp2
seed: 42
benchmarks:
  - {name: ifeval, count: 256, minutes: 90, tokens: 1024}
  - {name: humaneval_plus, count: 164, minutes: 75, tokens: 2048}
  - {name: bbh, count: 400, minutes: 45}
  - {name: mmlu_pro, count: 400, minutes: 90}
budgets:
  active_hours: 10
  model_active_hours: {int4-v1: 5, int8-v2: 5}
  queue_hours: 1
  grade_seconds: 120
