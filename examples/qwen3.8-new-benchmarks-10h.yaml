# Overnight bounded comparison: 25 examples per new benchmark.
# INT4-v1 runs as TP1 replicas across both GPUs, then INT8-v2 runs as TP2.
version: 1
models: [int4-v1, int8-v2]
runtime_profiles:
  int4-v1: int4-v1-16k-fp8-tp1
  int8-v2: int8-v2-16k-bf16-tp2
distribution:
  gpus: auto
seed: 42
benchmarks:
  - {name: ifbench, count: 25, minutes: 100, tokens: 4096}
  - {name: gpqa_diamond, count: 25, minutes: 100, tokens: 8192}
  - {name: livecodebench_v6, count: 25, minutes: 100, tokens: 8192}
generation:
  enable_thinking: true
  reasoning_effort: medium
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  preserve_thinking: true
  request_deadline_seconds: 300
budgets:
  active_hours: 10
  model_active_hours: {int4-v1: 5, int8-v2: 5}
  queue_hours: 24
  grade_seconds: 120
