# Serial profile-switch acceptance: each model gets its native validated runtime.
version: 1
models: [int8-v2, int4-v1]
runtime_profiles:
  int8-v2: int8-v2-262k-fp8-tp2
  int4-v1: int4-v1-96k-fp8-tp1
seed: 42
benchmarks:
  - {name: ifeval, count: 2}
  - {name: humaneval_plus, count: 2}
  - {name: bbh, count: 2}
  - {name: mmlu_pro, count: 2}
budgets:
  active_hours: 8
  model_active_hours: {int8-v2: 4, int4-v1: 4}
  queue_hours: 24
  grade_seconds: 120
