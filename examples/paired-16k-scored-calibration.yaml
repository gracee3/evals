# Paired, serial, four-domain calibration. Counts are total per benchmark and
# the same frozen example IDs are scored by both models.
version: 1
models: [int4-v1, int8-v2]
runtime_profiles:
  int4-v1: int4-v1-16k-fp8-tp1
  int8-v2: int8-v2-16k-bf16-tp2
seed: 42
benchmarks:
  - {name: ifeval, count: 16}
  - {name: humaneval_plus, count: 16}
  - {name: bbh, count: 16}
  - {name: mmlu_pro, count: 16}
budgets:
  active_hours: 4
  model_active_hours: {int4-v1: 2, int8-v2: 2}
  queue_hours: 8
  grade_seconds: 120
